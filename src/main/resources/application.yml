server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    default-property-inclusion: non_null

app:
  # Az /api/** végpontok védelme (X-API-Key fejléc). Ha üres, minden /api hívás tiltott.
  api-key: ${APP_API_KEY:}
  # true: minden elérhető AI feldolgozza a leveleket (összehasonlító mód)
  test-mode: ${TEST_MODE:false}
  # test-mode=false esetén ez az egy AI fut: claude | gemini
  active-provider: ${ACTIVE_PROVIDER:claude}
  # OFF: nem küld választ | SEND: elküldi (test módban csak a TEST_REVIEW_EMAIL-re)
  reply-mode: ${REPLY_MODE:OFF}
  test-review-email: ${TEST_REVIEW_EMAIL:}
  poll-interval-ms: ${POLL_INTERVAL_MS:60000}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${CLAUDE_MODEL:claude-haiku-5-5}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
    address: ${GMAIL_ADDRESS:}
